security:
    providers:
        in_memory:
            memory: ~

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        admin:
            pattern: ^/admin
            stateless: true
        main:
            lazy: true

    access_control:
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/health, roles: PUBLIC_ACCESS }
